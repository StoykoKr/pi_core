# Re4Life MQTT broker — mTLS only.
# Certs come from scripts/init-ca.sh into /robot_data/certs (mounted ro).
# The broker key is chowned to uid/gid 1883 (mosquitto in-container user)
# by init-ca.sh so this container can read it without running as root.

per_listener_settings true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice

# ── mTLS listener (mobile app + mqtt_bridge) ────────────────────────────────
listener 8883
cafile  /robot_data/certs/root_ca.crt
certfile /robot_data/certs/mqtt_cert.crt
keyfile  /robot_data/certs/mqtt_key.key
require_certificate true
use_identity_as_username true
allow_anonymous false

# ── DEBUG ONLY: plain localhost listener ────────────────────────────────────
# Uncomment during bring-up to separate protocol bugs from TLS bugs
# (contract: ":1883 only during Stage 2 bring-up"). Localhost-only, so it is
# unreachable from the AP network, but comment it back out when done.
#listener 1883 127.0.0.1
#allow_anonymous true
